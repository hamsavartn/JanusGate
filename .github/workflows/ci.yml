name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile all modules
        run: python -m compileall backend simulator evals dashboard tests
      - name: Run tests (offline mode — no API keys in CI)
        run: python -m pytest tests/ -q
      - name: Held-out eval
        run: python -m evals.run_eval
      - name: External benchmark (uses vendored public dataset)
        run: python -m evals.run_external_eval
      - name: Upload eval report
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: evals/report.md
